[package]
name = "tazko"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

[dependencies]
axum = "0.8"
brotli = "8"
clap = { version = "4", features = ["derive"] }
getrandom = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }

[build-dependencies]
brotli = "8"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3.27.0"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
