[package]
name = "tazko"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
base64 = "0.23.1"
brotli = "8"
clap = { version = "4", features = ["derive"] }
form_urlencoded = "1"
futures-util = "0.3.34"
getrandom = "0.3"
hmac = "0.13.0"
http-body-util = "0.1"
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
rusqlite = { version = "0.41", features = ["bundled", "backup"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-platform-verifier = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.11.1"
subtle = "2.6.1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs", "io-util"] }
tower = { version = "0.5", features = ["util"] }
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "_ring", "platform-verifier", "json"] }

[build-dependencies]
brotli = "8"

[dev-dependencies]
rand = "0.8"
rsa = "0.9"
tokio-tungstenite = "0.28"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package.rsa]
opt-level = 3
